<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Hilda's Postres & Snacks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
    
    <style>
        /* NAVBAR BLANCA */
        .top-navbar {
            background-color: #ffffff !important;
            padding: 12px 40px !important;
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05) !important;
            position: relative;
            z-index: 20;
            width: 100%;
            box-sizing: border-box;
        }
        .nav-brand img { height: 45px !important; width: auto !important; }
        .nav-menu { display: flex; gap: 25px; }
        .nav-menu a { text-decoration: none; color: #4a4a4a; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 14px; }
        .nav-menu a:hover { color: #ff4d6d; }
        .nav-icons { display: flex; align-items: center; gap: 20px; }
        .cart-wrapper { position: relative; color: #4a4a4a; font-size: 20px; text-decoration: none; }
        .cart-badge-count { position: absolute; top: -8px; right: -10px; background: #ff4d6d; color: white; font-size: 11px; font-weight: bold; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
        .ws-link { color: #4a4a4a; font-size: 22px; text-decoration: none; }
        .btn-user-nav { color: #ff4d6d; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 15px; text-decoration: none; display: flex; align-items: center; gap: 6px; }

        /* LAYOUT DOS COLUMNAS */
        .page-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 80px;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .hero-left { max-width: 420px; }
        .hero-left h1 { font-family: 'Outfit', sans-serif; font-size: 52px; font-weight: 800; color: #2b2b2b; line-height: 1.1; margin-bottom: 8px; }
        .hero-left p.hero-subtitle { color: #777; font-size: 18px; margin-bottom: 12px; font-family: 'Outfit', sans-serif; }
        .hero-heart { color: #ff4d6d; font-size: 24px; margin-bottom: 16px; }
        .pill-dessert { display: inline-flex; align-items: center; background: #ffffff; padding: 10px 20px; border-radius: 25px; box-shadow: 0 4px 15px rgba(255, 143, 163, 0.2); font-size: 15px; color: #555; font-weight: 600; font-family: 'Outfit', sans-serif; }

        /* TARJETA LOGIN */
        .login-card { background: #fff; padding: 40px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
        .card-badge-logo img { width: 75px !important; height: 75px !important; border-radius: 50%; object-fit: cover; margin-bottom: 15px; }
        .login-card h2 { font-size: 28px; color: #ff4d6d; font-weight: 800; margin-bottom: 5px; font-family: 'Outfit', sans-serif; }
        .login-card .subtitle { color: #777; font-size: 14px; margin-bottom: 25px; font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body style="background-color: #fff0f3; margin: 0; min-height: 100vh; display: flex; flex-direction: column;">

    <!-- NAVBAR -->
    <header class="top-navbar">
        <a href="../inicio.html" class="nav-brand">
            <img src="../logo.png" alt="Hilda's Logo" onerror="this.src='./logo.png'">
        </a>
        <nav class="nav-menu">
            <a href="../inicio.html">INICIO</a>
            <a href="../postres.html">POSTRES</a>
            <a href="../bebidas.html">BEBIDAS</a>
            <a href="../snacks.html">SNACKS</a>
        </nav>
        <div class="nav-icons">
            <a href="../carrito.html" class="cart-wrapper">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge-count">0</span>
            </a>
            <a href="https://wa.me/5512345678" target="_blank" class="ws-link">
                <i class="fab fa-whatsapp"></i>
            </a>
            <a href="registro.html" class="btn-user-nav">
                <i class="far fa-user"></i> Crear cuenta
            </a>
        </div>
    </header>

    <!-- LAYOUT CENTRAL -->
    <div class="page-wrapper">
        <!-- <div class="hero-left">
            <h1>¡Bienvenido!</h1>
            <p class="hero-subtitle">Dulces momentos, siempre contigo.</p>
            <div class="hero-heart">♥</div>
            <div class="pill-dessert">
                <span>🍓 Fresas con crema</span>
            </div>
        </div-->

        <div class="login-card">
            <div class="card-badge-logo">
                <img src="../logo.png" alt="Logo" onerror="this.src='./logo.png'">
            </div>
            <h2>¡Inicia sesión!</h2>
            <p class="subtitle">Ingresa tus datos para continuar</p>

            <form id="loginForm">
                <div class="form-group" style="text-align: left;">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="tu@correo.com" required>
                    </div>
                </div>

                <div class="form-group" style="text-align: left;">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                        <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">INICIAR SESIÓN <i class="fas fa-arrow-right"></i></button>
            </form>

            <div class="login-footer-links" style="margin-top: 20px; text-align: center; font-family: 'Outfit', sans-serif;">
                <p style="color: #666; font-size: 14px; margin-bottom: 8px;">¿No tienes cuenta? <a href="registro.html" style="color: #ff4d6d; font-weight: 600; text-decoration: none;">Regístrate aquí</a></p>
                <p style="color: #666; font-size: 14px;">¿Olvidaste tu contraseña? <a href="../recuperarc/recuperarc.html" style="color: #ff4d6d; font-weight: 600; text-decoration: none;">Recupérala aquí</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js"></script>
</body>
</html>
