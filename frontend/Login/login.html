<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Hilda's Postres & Snacks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 1. Importamos tu hoja de estilos principal para que el Header ondulado funcione -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="login.css">
    
    <style>
        /* Eliminamos el bloque "NAVBAR BLANCA" para no hacer conflicto */
        
        /* LAYOUT DOS COLUMNAS */
        .page-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 80px;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .hero-left { max-width: 420px; }
        .hero-left h1 { font-family: 'Outfit', sans-serif; font-size: 52px; font-weight: 800; color: #2b2b2b; line-height: 1.1; margin-bottom: 8px; }
        .hero-left p.hero-subtitle { color: #777; font-size: 18px; margin-bottom: 12px; font-family: 'Outfit', sans-serif; }
        .hero-heart { color: #ff4d6d; font-size: 24px; margin-bottom: 16px; }
        .pill-dessert { display: inline-flex; align-items: center; background: #ffffff; padding: 10px 20px; border-radius: 25px; box-shadow: 0 4px 15px rgba(255, 143, 163, 0.2); font-size: 15px; color: #555; font-weight: 600; font-family: 'Outfit', sans-serif; }

        /* TARJETA LOGIN */
        .login-card { background: #fff; padding: 40px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
        .card-badge-logo img { width: 75px !important; height: 75px !important; border-radius: 50%; object-fit: cover; margin-bottom: 15px; }
        .login-card h2 { font-size: 28px; color: #ff4d6d; font-weight: 800; margin-bottom: 5px; font-family: 'Outfit', sans-serif; }
        .login-card .subtitle { color: #777; font-size: 14px; margin-bottom: 25px; font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body style="background-color: #fff0f3; margin: 0; min-height: 100vh; display: flex; flex-direction: column;">

    <!-- 2. Inyectamos el contenedor modular de nuestra barra -->
    <header class="header" id="header-container"></header>

    <!-- LAYOUT CENTRAL -->
    <div class="page-wrapper">
        <div class="login-card">
            <div class="card-badge-logo">
                <img src="../logo.png" alt="Logo" onerror="this.src='./logo.png'">
            </div>
            <h2>¡Inicia sesión!</h2>
            <p class="subtitle">Ingresa tus datos para continuar</p>

            <form id="loginForm">
                <div class="form-group" style="text-align: left;">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="tu@correo.com" required>
                    </div>
                </div>

                <div class="form-group" style="text-align: left;">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                        <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">INICIAR SESIÓN <i class="fas fa-arrow-right"></i></button>
            </form>

            <div class="login-footer-links" style="margin-top: 20px; text-align: center; font-family: 'Outfit', sans-serif;">
                <p style="color: #666; font-size: 14px; margin-bottom: 8px;">¿No tienes cuenta? <a href="registro.html" style="color: #ff4d6d; font-weight: 600; text-decoration: none;">Regístrate aquí</a></p>
                <p style="color: #666; font-size: 14px;">¿Olvidaste tu contraseña? <a href="../recuperarc/recuperarc.html" style="color: #ff4d6d; font-weight: 600; text-decoration: none;">Recupérala aquí</a></p>
            </div>
        </div>
    </div>

    <!-- 3. Vinculamos el script que dibuja el encabezado automáticamente -->
    <script src="../header.js"></script>
    <script src="login.js"></script>
</body>
</html>
