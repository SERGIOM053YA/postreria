server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;

  location = /health { return 200 'ok'; add_header Content-Type text/plain; }

  # Todo lo que empiece con /api/ va al contenedor PHP, con la misma ruta.
  # Se usa el DNS interno de Docker y una variable para que nginx vuelva a
  # resolver "backend" cuando ese contenedor se recrea en un despliegue.
  resolver 127.0.0.11 valid=10s;
  location /api/ {
    set $backend http://backend:80;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / { try_files $uri $uri/ /index.html; }

  location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico|woff2)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
