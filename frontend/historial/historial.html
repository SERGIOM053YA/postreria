<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilda's Postres & Snacks - Mis Pedidos</title>
    
    <!-- Enlaces a CSS -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="historial.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- ========== HEADER MODULAR ========== -->
    <header class="header" id="header-container"></header>

    <!-- ========== CONTENIDO PRINCIPAL ========== -->
    <main class="orders-container">
        <div class="page-title">
            <h2>Mis Pedidos <span style="color:#ff6b81;">♡</span></h2>
            <p>Consulta el historial y detalle de tus compras realizadas</p>
        </div>

        <!-- Contenedor dinámico donde JS dibujará los pedidos reales -->
        <div id="orders-list">
            <div style="text-align: center; padding: 3rem; color: #ff6b81;">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p style="margin-top: 10px; font-weight: bold;">Cargando tu historial...</p>
            </div>
        </div>
    </main>

    <!-- ========== FOOTER ========== -->
    <footer class="footer" id="footer">
        <p>&copy; Hilda's Postres & Snacks - Hecho con <i class="fas fa-heart" style="color: #ff6b81;"></i></p>
    </footer>

    <!-- Enlaces a JS -->
    <script src="../header.js"></script>
    <script src="../cart.js"></script> <!-- Este script enciende tu sesión -->
    <script src="historial.js"></script>
    <!-- Enlaces a CSS -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../carrito.css"> <!-- ESTA ES LA LÍNEA MÁGICA -->
    <link rel="stylesheet" href="historial.css">

</body>
</html>
