<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff0f3">
    <title>Sucursal cerrada | Hilda's Postres &amp; Snacks</title>
    <!-- Ruta corregida para la raíz -->
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background: radial-gradient(ellipse at 50% 15%, #fff 0, #fff0f3 48%, #ffe6ed 100%);
        }

        .closed-header {
            min-height: 112px;
            padding: 12px clamp(1rem, 5vw, 5rem);
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
            box-shadow: 0 5px 22px rgba(74, 59, 50, .07);
        }

        .closed-logo-link { display: inline-flex; align-items: center; }
        .closed-logo {
            display: block;
            width: clamp(105px, 12vw, 150px);
            aspect-ratio: 1;
            object-fit: contain;
            border-radius: 50%;
            border: 5px solid #fff;
            box-shadow: 0 5px 18px rgba(74, 59, 50, .16);
        }

        .closed-login {
            position: absolute;
            right: clamp(1rem, 5vw, 5rem);
            display: inline-flex;
            align-items: center;
            gap: .55rem;
            padding: .75rem 1.2rem;
            border-radius: 999px;
            color: #d63859;
            background: #fff0f3;
            text-decoration: none;
            font-weight: 700;
            transition: background .2s, transform .2s, box-shadow .2s;
        }

        .closed-login:hover {
            background: #ffe1e8;
            box-shadow: 0 5px 14px rgba(214, 56, 89, .15);
            transform: translateY(-2px);
        }

        .closed-main {
            flex: 1;
            width: 100%;
            display: grid;
            place-items: center;
            padding: clamp(2.5rem, 7vh, 5rem) 1.25rem;
            position: relative;
            isolation: isolate;
        }

        .closed-main::before, .closed-main::after {
            content: "";
            position: absolute;
            z-index: -1;
            border-radius: 50%;
            background: rgba(255, 184, 200, .35);
            filter: blur(1px);
        }
        .closed-main::before { width: 170px; height: 170px; top: 12%; left: max(-55px, 5vw); }
        .closed-main::after { width: 110px; height: 110px; right: max(-25px, 12vw); bottom: 10%; }

        .closed-card {
            width: min(100%, 760px);
            padding: clamp(2rem, 6vw, 4rem) clamp(1.25rem, 6vw, 4.5rem);
            text-align: center;
            background: rgba(255, 255, 255, .92);
            border: 1px solid rgba(240, 84, 115, .15);
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(214, 56, 89, .13);
            animation: card-in .55s ease-out both;
        }

        .closed-icon-wrap {
            width: 104px;
            height: 104px;
            margin: 0 auto 1.4rem;
            display: grid;
            place-items: center;
            color: #f05473;
            background: #fff0f3;
            border: 1px solid #ffd5df;
            border-radius: 50%;
            font-size: 2.8rem;
        }

        .closed-eyebrow {
            margin: 0 0 .65rem;
            color: #d63859;
            font-size: .78rem;
            font-weight: 800;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        .closed-card h1 {
            margin: 0 auto .9rem;
            color: #38242b;
            font-size: clamp(2rem, 5vw, 3rem);
            line-height: 1.12;
            font-weight: 800;
        }

        .closed-card h1 span { color: #f05473; }
        .closed-message {
            max-width: 560px;
            margin: 0 auto 1.6rem;
            color: #765e64;
            font-size: clamp(1rem, 2vw, 1.12rem);
            line-height: 1.7;
        }

        .schedule-badge {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: .65rem;
            max-width: 100%;
            padding: .85rem 1.2rem;
            border-radius: 999px;
            background: #fff5f8;
            border: 1px solid #ffd5df;
            color: #b93654;
            font-weight: 700;
            line-height: 1.45;
        }
        .schedule-badge i { flex: 0 0 auto; }

        .closed-footer {
            padding: 0 1rem 1.25rem;
            text-align: center;
            color: #967c82;
            font-size: .85rem;
        }
        .closed-footer i { color: #f05473; }

        @keyframes card-in {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 520px) {
            .closed-header { min-height: 92px; justify-content: flex-start; }
            .closed-logo { width: 92px; }
            .closed-login { right: 1rem; padding: .65rem .85rem; font-size: .9rem; }
            .closed-card { border-radius: 24px; }
            .closed-icon-wrap { width: 86px; height: 86px; font-size: 2.3rem; }
            .schedule-badge { border-radius: 18px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>

<body>
    <header class="closed-header">
        <!-- Rutas corregidas quitando el ../ ya que el archivo está en la raíz -->
        <a class="closed-logo-link" href="index.html" aria-label="Ir al inicio">
            <img src="logo.png" alt="Hilda's Postres &amp; Snacks" class="closed-logo">
        </a>
        <a href="Login/login.html" class="closed-login">
            <i class="far fa-user" aria-hidden="true"></i>
            <span>Iniciar sesión</span>
        </a>
    </header>

    <main class="closed-main">
        <section id="closed-store-banner" class="closed-card" aria-labelledby="closed-title">
            <div class="closed-icon-wrap" aria-hidden="true"><i class="fas fa-store-slash"></i></div>
            <p class="closed-eyebrow">Hilda's Postres &amp; Snacks</p>
            <h1 id="closed-title">¡Sucursal cerrada <span>temporalmente!</span></h1>
            <p class="closed-message"></p>
            <div class="schedule-badge">
                <i class="far fa-clock" aria-hidden="true"></i>
                <span>Viernes, sábados y domingos · 6:00 p. m. a 11:00 p. m.</span>
            </div>
        </section>

        <section id="store-menu-content" class="closed-card" style="display:none" aria-live="polite">
            <div class="closed-icon-wrap" aria-hidden="true"><i class="fas fa-heart"></i></div>
            <p class="closed-eyebrow">¡Ya estamos atendiendo!</p>
            <h1>¡La sucursal está <span>abierta!</span></h1>
            <p class="closed-message">Ya puedes realizar tus pedidos. ¡Gracias por elegirnos!</p>
            <a href="index.html" class="closed-login" style="position:static">Ver menú <i class="fas fa-arrow-right" aria-hidden="true"></i></a>
        </section>
    </main>

    <script>
        async function checkStoreStatus() {
            try {
                // 1. Preguntar al Interruptor Maestro PHP (La ruta sube un nivel hacia api/)
                const res = await fetch('../api/configuracion.php');
                const config = await res.json();
                
                // Si está apagado desde el admin, ignora el reloj
                if (!config.abierta) {
                    mostrarPantallaCerrada("La sucursal ha sido cerrada manualmente por hoy. ¡Te esperamos mañana!");
                    return;
                }

                // 2. Si el interruptor está abierto, evaluamos el horario automático
                const now = new Date();
                const day = now.getDay();
                const hour = now.getHours();
                const isOperatingDay = day === 5 || day === 6 || day === 0;
                const isOperatingHour = hour >= 18 && hour < 23;
                
                if (isOperatingDay && isOperatingHour) {
                    document.getElementById('closed-store-banner').style.display = 'none';
                    document.getElementById('store-menu-content').style.display = 'block';
                } else {
                    mostrarPantallaCerrada("Nuestro horario es de Viernes a Domingo, de 6:00 p.m. a 11:00 p.m.");
                }
            } catch (e) {
                console.error("Error validando el estado de la tienda", e);
            }
        }

        function mostrarPantallaCerrada(mensaje) {
            document.getElementById('closed-store-banner').style.display = 'block';
            document.getElementById('store-menu-content').style.display = 'none';
            document.querySelector('.closed-message').textContent = mensaje;
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkStoreStatus();
            setInterval(checkStoreStatus, 60000);
        });
    </script>
</body>
</html>
